[package]
name = "grain"
description = "Local-first semantic code review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["code-review", "pull-request", "git", "review"]

[[bin]]
name = "grain"
path = "src/main.rs"

[dependencies]
grain-agent.workspace = true
grain-engine.workspace = true
grain-github.workspace = true
grain-lsp.workspace = true
grain-server.workspace = true
grain-store.workspace = true
serde.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
open.workspace = true
dirs.workspace = true
qrcode.workspace = true

[lints]
workspace = true

# Only the `grain` binary is shipped; library crates are internal.
[package.metadata.dist]
dist = true
