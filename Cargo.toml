[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
repository = "https://github.com/pranav2012/grain"
homepage = "https://github.com/pranav2012/grain"

[workspace.dependencies]
grain-agent = { path = "crates/grain-agent" }
grain-engine = { path = "crates/grain-engine" }
grain-git = { path = "crates/grain-git" }
grain-github = { path = "crates/grain-github" }
grain-lsp = { path = "crates/grain-lsp" }
grain-server = { path = "crates/grain-server" }
grain-store = { path = "crates/grain-store" }
grain-diagnostics = { path = "crates/grain-diagnostics" }

anyhow = "1"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
sem-core = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
ts-rs = "12.0.1"
which = "8.0.6"
dirs = "7.0.0"
open = "5.4.4"
mime_guess = "2.0.5"
rust-embed = "8.13.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
tempfile = "3.27.0"
globset = "0.4.20"
base64 = "0.22"
qrcode = { version = "0.14.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
# Pedantic lints that cost more than they catch (same allow-list as astral-sh/uv).
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
# Restriction lints worth enforcing.
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"

# Profile used by `dist` for release binaries.
[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"
