# Builds the website on PRs that touch website/, so a broken site is caught before merge.
# Deploys happen on Cloudflare (Workers Builds, from main); see website/README.md.
name: Website

on:
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    # Only this repository's own PRs run; PRs from forks never do.
    if: github.repository == 'pranav2012/grain' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:check
      - run: pnpm build
