name: CI

# Website-only changes skip all of this (website.yml handles them).
on:
  push:
    branches: [main]
    paths-ignore: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths-ignore: ['website/**', '.github/workflows/website.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: its release job may be halfway through tagging.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    # Only this repository's own pushes and PRs run CI; forks and PRs from forks never do.
    if: github.repository == 'pranav2012/grain' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TypeScript types are up to date
        run: git diff --exit-code -- ui/src/types/generated

  ui:
    # Only this repository's own pushes and PRs run CI; forks and PRs from forks never do.
    if: github.repository == 'pranav2012/grain' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  commits:
    # Commit titles decide the next version, so they must be Conventional Commits.
    if: github.repository == 'pranav2012/grain' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Commit titles follow Conventional Commits
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range=("$AFTER" -1)
          else
            range=("$BEFORE..$AFTER")
          fi
          mapfile -t titles < <(git log --no-merges --format=%s "${range[@]}")
          scripts/check-commit-title.sh "${titles[@]}"

  release:
    # After every check passes on main: if the new commits warrant it, bump the version, update
    # CHANGELOG.md, tag, and start the release workflow (builds, GitHub Release, Homebrew, npm).
    needs: [rust, ui, commits]
    if: github.repository == 'pranav2012/grain' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Decide the next version
        id: next
        run: echo "version=$(scripts/next-release.sh)" >> "$GITHUB_OUTPUT"
      - name: Bump, tag and start the release
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/set-version.sh "$VERSION"
          git cliff --unreleased --exclude-path "website/**" --tag "v$VERSION" --prepend CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "Grain $VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
          gh workflow run release.yml --ref "v$VERSION" -f tag="v$VERSION"
          echo "Releasing v$VERSION" >> "$GITHUB_STEP_SUMMARY"
